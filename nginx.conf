# ============================================================================
#  Configuracion de Nginx para servir el microfrontend de Optimizacion de
#  Horarios como archivos estaticos.
#
#  Un microfrontend Single-SPA no "corre" como proceso: tras el build es un
#  bundle JavaScript (main.js) que el shell/root institucional carga por su
#  URL. Este Nginx es solo la "estanteria" que entrega ese archivo por HTTP.
#
#  Como el root institucional vive en otro dominio y carga main.js de forma
#  cross-origin, se habilitan cabeceras CORS sobre los assets.
# ============================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Assets estaticos del microfrontend (main.js y demas). Llevan CORS
    # porque el root institucional los solicita desde otro origen.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|json|map)$ {
        add_header 'Access-Control-Allow-Origin'  '*'            always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*'            always;
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # index.html (util para probar el MF de forma aislada). No se cachea
    # para que siempre sirva la version mas reciente.
    location / {
        add_header 'Access-Control-Allow-Origin'  '*'            always;
        add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;
        try_files $uri $uri/ /index.html;
    }
}
